on:
  push:
    branches: [master]
  pull_request:

name: CI / Tests on macOS

permissions: read-all

jobs:

  test-on-macos:
    # Since macOS 15 a process needs "Local Network Permission" to send
    # multicast, and a GitHub runner cannot grant it: as the runner user the
    # multicast test fails with "No route to host". Run as root, all tests pass.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --no-run
      - run: sudo env "PATH=$PATH" "HOME=$HOME" cargo test -- --test-threads=1
